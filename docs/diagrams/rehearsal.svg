<style>
.flow { stroke-dasharray: 6 9; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -30; } }
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.st { animation: hl 7.2s ease-in-out infinite; } @keyframes hl { 0%, 14%, 100% { stroke-width: 1; } 4%, 10% { stroke-width: 3; } } .s0 { animation-delay: 0.0s; } .s1 { animation-delay: 1.2s; } .s2 { animation-delay: 2.4s; } .s3 { animation-delay: 3.6s; } .s4 { animation-delay: 4.8s; } .s5 { animation-delay: 6.0s; }</style>
