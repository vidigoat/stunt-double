<text x="48" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#0A0A0A" font-weight="400" text-anchor="start" >Rehearse. Measure. <tspan font-style="italic" fill="#1463FF">Then approve.</tspan></text>
