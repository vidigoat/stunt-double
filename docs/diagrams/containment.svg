<g class="n0"><text x="76" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#E5484D" font-weight="400" text-anchor="start" >0</text></g>
<text x="76" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#6B6B66" font-weight="400" text-anchor="start" >customers, after the plan ran DELETE FROM customers</text>
