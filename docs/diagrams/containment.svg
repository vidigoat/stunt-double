<circle cx="53" cy="51" r="4.5" fill="#1463FF"/><text x="66" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6B6B66" font-weight="700" text-anchor="start" letter-spacing="1.5">CONTAINMENT · CHALLENGE 01</text>
<text x="48" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#0A0A0A" font-weight="400" text-anchor="start" >The blast radius is <tspan font-style="italic" fill="#1463FF">zero.</tspan></text>
