</defs>
<style>
.flow { stroke-dasharray: 6 9; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -30; } }
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.n1 { animation: n1 6s infinite; } .n0 { animation: n0 6s infinite; } .hit { animation: hit 6s infinite; }@keyframes n1 { 0%, 30% { opacity: 1; } 36%, 94% { opacity: 0; } 100% { opacity: 1; } }@keyframes n0 { 0%, 30% { opacity: 0; } 36%, 94% { opacity: 1; } 100% { opacity: 0; } }@keyframes hit { 0% { opacity: 0; } 10%, 34% { opacity: 1; } 44%, 100% { opacity: 0; } }</style>
