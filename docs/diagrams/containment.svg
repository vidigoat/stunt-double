<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Containment: the double drops from 1,300 customers to 0; production keeps all 1,300">
<title>Containment: the double drops from 1,300 customers to 0; production keeps all 1,300</title>
<defs>
