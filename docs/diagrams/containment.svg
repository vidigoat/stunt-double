<text x="570" y="396" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#0A0A0A" font-weight="700" text-anchor="middle" >gVisor wall</text>
<rect x="622" y="150" width="530" height="210" rx="16" fill="#FFFFFF" stroke="#E6E6E1" filter="url(#sh)" />
<text x="650" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6B6B66" font-weight="700" text-anchor="start" letter-spacing="1.5">PRODUCTION</text>
<text x="650" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#0A0A0A" font-weight="400" text-anchor="start" >1,300</text>
<text x="650" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#6B6B66" font-weight="400" text-anchor="start" >customers, untouched. Nothing real happened.</text>
