# Stunt Double on one Vultr Cloud Compute VM.
# Every container keeps at most 3 x 10 MB of logs, so a long-running demo never fills the disk.
x-logs: &logs
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    <<: *logs
    ports: ["80:80", "443:443"]
    environment: { SITE_HOST: "${SITE_HOST}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: [web, api, mcp, mailpit]

  web:
    build: { context: ../web, args: { NEXT_PUBLIC_SITE_URL: "https://${SITE_HOST}", API_URL: "http://api:8000" } }
    restart: unless-stopped
    <<: *logs
    environment: { API_URL: "http://api:8000" }

  api:
    build: ../api
    restart: unless-stopped
    <<: *logs
    env_file: [.env]           # VULTR_INFERENCE_KEY lives here, never inside a sandbox
    environment:
      SD_DATA_DIR: /opt/stunt-double/data
      SD_RUNS_DIR_HOST: /opt/stunt-double/data/runs
      SD_SANDBOX_RUNTIME: "${SD_SANDBOX_RUNTIME-runsc}"  # gVisor (override only for local testing)
      SD_SMTP_HOST: mailpit
      SD_SMTP_PORT: "1025"
      SD_MAILPIT_API: http://mailpit:8025/mail
      SD_PUBLIC_URL: "https://${SITE_HOST}"
      # One-click sample Postgres for the console: an internal container, read-only role, not reachable from outside.
      SD_SAMPLE_PG_URL: postgresql://sd_readonly:sd-sample-readonly@sample-pg:5432/saas
      # Models and spend caps live in the repo (not the VM's .env), so a push changes them. Measured in docs/VERIFIER_EVAL.md:
      # glm-5.3 (non-flash) spends its whole budget reasoning and never answers; the flash models answer in seconds.
      SD_AGENT_MODEL: "${SD_AGENT_MODEL_PIN:-glm-5.3-flash,qwen3.8-flash-next}"
      SD_VERIFIER_MODEL: "${SD_VERIFIER_MODEL_PIN:-glm-5.3-flash,qwen3.8-flash-next}"
      # $50 hard cap for the hackathon: worst case 5 days x (100 agent runs + 200 AI checks) ~ $30 + the VM ~ $4.
      SD_DAILY_AGENT_RUNS: "${SD_DAILY_AGENT_RUNS_PIN:-100}"
      SD_DAILY_VERIFICATIONS: "${SD_DAILY_VERIFICATIONS_PIN:-200}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock     # to start sandboxes on the host daemon
      - /opt/stunt-double/data:/opt/stunt-double/data # same path inside and outside, so bind mounts line up

  mcp:
    build: ../mcp
    restart: unless-stopped
    <<: *logs
    environment:
      STUNT_DOUBLE_API: http://api:8000
      STUNT_DOUBLE_PUBLIC: "https://${SITE_HOST}"
      STUNT_DOUBLE_ALLOWED_HOSTS: "${SITE_HOST}"

  sample-pg:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logs
    environment: { POSTGRES_DB: saas, POSTGRES_PASSWORD: sample-only-not-exposed }
    volumes: ["./sample-pg/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    # no ports: only the api container can reach it, on the compose network

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    <<: *logs
    environment: { MP_WEBROOT: "mail", MP_MAX_MESSAGES: "5000" }

volumes:
  caddy_data:
