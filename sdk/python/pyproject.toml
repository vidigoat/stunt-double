[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stunt-double"
version = "0.1.0"
description = "Rehearse AI agent actions on a throwaway copy of your business before they touch production."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/vidigoat/stunt-double"
