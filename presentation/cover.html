<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Geist+Mono&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  html, body { width:100%; height:100%; }
  body { background:#FAFAF8; color:#0A0A0A; font-family:"DM Sans",sans-serif; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; overflow:hidden; position:relative;
    background-image:linear-gradient(to right,rgba(10,10,10,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(10,10,10,.05) 1px,transparent 1px); background-size:calc(var(--u)*3.2) calc(var(--u)*3.2); }
  .brand { display:flex; align-items:center; gap:calc(var(--u)*1); font-family:"Fraunces",serif; font-size:calc(var(--u)*3.4) }
  .brand svg { width:calc(var(--u)*4); height:calc(var(--u)*4) }
  h1 { font-family:"Fraunces",serif; font-weight:400; letter-spacing:-.02em; font-size:calc(var(--u)*13); line-height:.92; margin-top:calc(var(--u)*3) }
  .chip { margin-top:calc(var(--u)*4); display:inline-flex; gap:calc(var(--u)*1.6); align-items:center; font-family:"Geist Mono",monospace; font-size:calc(var(--u)*2.1); border:2px solid #E4E4E0; background:#fff; border-radius:999px; padding:calc(var(--u)*1) calc(var(--u)*2.2) }
  .red { color:#E5484D } .muted { color:#6B6B66 }
  .foot { position:absolute; bottom:calc(var(--u)*3); font-family:"Geist Mono",monospace; font-size:calc(var(--u)*1.6); color:#6B6B66 }
</style></head>
