name: CI
on: [push, pull_request]
jobs:
  engine:
    name: Rehearsal engine (sandbox, containment, apply, drift)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt ruff==0.8.6
      - run: ruff check --config api/ruff.toml api mcp infra presentation/video sdk
      - run: cd api && python -m pytest -q tests
  mcp:
    name: MCP server (real MCP client over stdio against the live API)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: docker build -t stunt-double-sandbox:latest -f sandbox/Dockerfile .
      - run: python -m venv api/.venv && api/.venv/bin/pip install -r api/requirements.txt
      - run: python -m venv mcp/.venv && mcp/.venv/bin/pip install -r mcp/requirements.txt
      - run: |
          cd api && SD_DATA_DIR=$RUNNER_TEMP/sd .venv/bin/uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          cd mcp && STUNT_DOUBLE_API=http://localhost:8000 .venv/bin/python tests/test_mcp.py
  web:
    name: Web build (Next.js + shadcn/ui)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run build
  e2e:
    name: End-to-end (real browser through the golden path)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: docker build -t stunt-double-sandbox:latest -f sandbox/Dockerfile .
      - run: python -m venv api/.venv && api/.venv/bin/pip install -r api/requirements.txt
      - run: cd web && npm ci && API_URL=http://localhost:8000 npm run build && cp -r .next/static .next/standalone/.next/ && cp -r public .next/standalone/
      - run: cd e2e && npm install && npx playwright install --with-deps chromium
      - run: |
          (cd api && SD_DATA_DIR=$RUNNER_TEMP/sd .venv/bin/uvicorn app.main:app --port 8000 &)
          (cd web/.next/standalone && PORT=3000 node server.js &)
          for i in $(seq 1 60); do curl -sf localhost:3000/api/health && break; sleep 1; done
          chunk=$(curl -s localhost:3000/app | grep -o '/_next/static/chunks/[^"]*\.js' | head -1)
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000$chunk)" = 200   # static assets are served
          cd e2e && BASE_URL=http://localhost:3000 SHOTS_DIR=$RUNNER_TEMP node golden-path.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: "${{ runner.temp }}/e2e-*.png", if-no-files-found: ignore }
